services:
  # ----------------------------------------------------
  # Backend Web Service (Node.js / Express API)
  # ----------------------------------------------------
  - type: web
    name: logitrack-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ----------------------------------------------------
  # Frontend Web Service (Next.js SSR)
  # ----------------------------------------------------
  - type: web
    name: logitrack-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
